<svg xmlns="http://www.w3.org/2000/svg" width="600" height="620" viewBox="0 0 600 620" role="img" aria-labelledby="title desc">
  <title id="title">Halit Ozger — Full Stack Developer and AI/ML Engineer</title>
  <desc id="desc">A mobile-optimized cinematic navy banner with large readable identity text and a cyan-violet AI network motif.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030014"/>
      <stop offset="0.55" stop-color="#070B24"/>
      <stop offset="1" stop-color="#10062B"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.36"/>
      <stop offset="0.58" stop-color="#4F46E5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.72" stop-color="#111737"/>
      <stop offset="1" stop-color="#090D24"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#818CF8" stroke-opacity="0.065"/>
    </pattern>
    <clipPath id="frame">
      <rect width="600" height="620" rx="28"/>
    </clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .orbit,.pulse,.signal{transform-box:fill-box;transform-origin:center}
      .orbit{animation:spin 30s linear infinite}
      .pulse{animation:pulse 5s ease-in-out infinite}
      .signal{animation:signal 4s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:.9;transform:scale(1.04)}}
      @keyframes signal{0%,100%{opacity:.3}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.orbit,.pulse,.signal{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="600" height="620" fill="url(#background)"/>
    <rect width="600" height="620" fill="url(#grid)"/>
    <ellipse cx="540" cy="80" rx="290" ry="260" fill="url(#aura)"/>
    <ellipse cx="40" cy="620" rx="310" ry="250" fill="url(#aura)" opacity="0.55"/>
    <g fill="#A5B4FC">
      <circle class="signal" cx="522" cy="270" r="2.4" fill="#22D3EE"/>
      <circle class="signal" cx="92" cy="412" r="2.2" fill="#C084FC"/>
      <circle cx="552" cy="386" r="1.6" opacity="0.5"/>
      <circle cx="54" cy="300" r="1.5" opacity="0.4"/>
      <circle cx="510" cy="590" r="1.8" opacity="0.45"/>
    </g>
    <rect x="1" y="1" width="598" height="618" rx="27" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

    <g class="sans">
      <text x="42" y="55" class="mono" font-size="17" letter-spacing="2.8" fill="#94A3B8">LONDON / UNITED KINGDOM</text>
      <rect x="42" y="79" width="56" height="4" rx="2" fill="url(#headline)"/>
      <text x="38" y="158" font-size="64" font-weight="750" letter-spacing="0.5" fill="url(#headline)">HALIT OZGER</text>
      <text x="42" y="216" class="mono" font-size="25" letter-spacing="1.8" fill="#C7D2FE">FULL STACK DEVELOPER</text>
      <text x="42" y="254" class="mono" font-size="25" letter-spacing="1.8" fill="#C7D2FE">AI/ML ENGINEER</text>
      <text x="42" y="323" font-size="28" fill="#E2E8F0">Intelligent systems.</text>
      <text x="42" y="361" font-size="28" fill="#E2E8F0">Useful products.</text>
    </g>

    <g>
      <circle class="pulse" cx="300" cy="494" r="116" fill="url(#aura)"/>
      <g class="orbit">
        <circle cx="300" cy="494" r="98" fill="none" stroke="#818CF8" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="3 10"/>
        <circle cx="300" cy="396" r="5.5" fill="#22D3EE"/>
        <circle cx="385" cy="543" r="4.5" fill="#C084FC"/>
        <circle cx="215" cy="543" r="4" fill="#818CF8"/>
      </g>
      <path class="signal" d="M300 396V431M385 543L347 520M215 543L253 520" fill="none" stroke="#818CF8" stroke-opacity="0.5" stroke-linecap="round"/>
      <path d="M300 425L360 460V528L300 563L240 528V460Z" fill="#0B1033" stroke="url(#edge)" stroke-width="1.6"/>
      <path d="M300 440L347 467V521L300 548L253 521V467Z" fill="url(#core)" stroke="#818CF8" stroke-opacity="0.2"/>
      <text x="300" y="505" text-anchor="middle" class="mono" font-size="32" font-weight="700" letter-spacing="2" fill="#E0E7FF">AI</text>
      <circle cx="300" cy="440" r="2.5" fill="#22D3EE"/>
      <circle cx="347" cy="521" r="2.5" fill="#C084FC"/>
      <circle cx="253" cy="521" r="2.5" fill="#818CF8"/>
    </g>
  </g>
</svg>
