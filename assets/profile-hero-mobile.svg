<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
<title id="title">Halit Ozger — AI Engineer at VerifyWise and Full Stack Developer</title>
<desc id="desc">A mobile-first intricate systems atlas with large identity text, four technical modules, evidence flows, and an accountable AI trust core.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050B14"/><stop offset=".55" stop-color="#071522"/><stop offset="1" stop-color="#0B2028"/></linearGradient>
  <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#67E8F9" stop-opacity=".08"/><stop offset=".5" stop-color="#67E8F9"/><stop offset="1" stop-color="#7DD3A8" stop-opacity=".2"/></linearGradient>
  <linearGradient id="titleLine" x1="0" x2="1"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#7DD3A8"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102636" stop-opacity=".97"/><stop offset="1" stop-color="#081722" stop-opacity=".95"/></linearGradient>
  <linearGradient id="plane" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#123447" stop-opacity=".12"/><stop offset="1" stop-color="#0A1C29" stop-opacity=".52"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#67E8F9" stop-opacity=".18"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#7DA4BA" stroke-opacity=".06"/></pattern>
  <pattern id="micro" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".65" fill="#8DB7C9" fill-opacity=".09"/></pattern>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
  <symbol id="node" viewBox="-7 -7 14 14"><circle r="5.5" fill="#071522" stroke="#67E8F9"/><circle r="1.8" fill="#67E8F9"/></symbol>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .evidence-pulse{stroke-dasharray:3 13;animation:flow 5s linear infinite}.atlas-rotate{transform-box:fill-box;transform-origin:center;animation:spin 38s linear infinite}.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 6s ease-in-out infinite}.node-pulse{animation:nodePulse 4s ease-in-out infinite}.delay-1{animation-delay:-1.3s}.delay-2{animation-delay:-2.6s}.delay-3{animation-delay:-3.4s}
    @keyframes flow{to{stroke-dashoffset:-80}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes breathe{0%,100%{opacity:.35;transform:scale(.985)}50%{opacity:.75;transform:scale(1.015)}}@keyframes nodePulse{0%,100%{opacity:.35}50%{opacity:1}}
    #identity{animation:enter .3s cubic-bezier(.22,.75,.25,1) both}#data-plane,#evidence-flow,#trust-core,#module-cards{animation:enter .4s cubic-bezier(.22,.75,.25,1) both;animation-delay:.18s}
    @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){.evidence-pulse,.atlas-rotate,.breathe,.node-pulse{animation:none}#identity,#data-plane,#evidence-flow,#trust-core,#module-cards{animation:none}}
  </style>
</defs>
<rect width="600" height="800" fill="url(#bg)"/>
<rect width="600" height="800" fill="url(#grid)"/>
<rect y="350" width="600" height="450" fill="url(#micro)"/>
<ellipse cx="520" cy="100" rx="280" ry="250" fill="url(#aura)"/>
<ellipse cx="300" cy="585" rx="270" ry="220" fill="url(#aura)"/>
<rect x="18" y="18" width="564" height="764" rx="24" fill="none" stroke="#27404D"/>
