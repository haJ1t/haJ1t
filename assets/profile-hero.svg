    <text x="64" y="278" font-size="30" font-weight="450" fill="#D5E2E9">Engineering systems that</text>
    <text x="64" y="319" font-size="30" font-weight="550" fill="url(#titleLine)">make AI accountable.</text>
    <text x="64" y="367" font-size="17" fill="#96ADBC">AI governance · agent infrastructure · full-stack products</text>
  </g>
