<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Halit Ozger — Full Stack Developer and AI/ML Engineer</title>
  <desc id="desc">A cinematic dark navy banner with cyan and violet orbital network artwork, introducing Halit Ozger and his work across intelligent systems and useful products.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030014"/>
      <stop offset="0.52" stop-color="#070B24"/>
      <stop offset="1" stop-color="#10062B"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.48" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="violetAura">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#4F46E5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanAura">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="0.72" stop-color="#111737"/>
      <stop offset="1" stop-color="#090D24"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#818CF8" stroke-opacity="0.065" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="400" rx="30"/>
    </clipPath>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .orbit,.orbit-reverse,.pulse,.float,.float-late,.signal,.signal-late{transform-box:fill-box;transform-origin:center}
      .orbit{animation:spin 32s linear infinite}
      .orbit-reverse{animation:spin-reverse 23s linear infinite}
      .pulse{animation:pulse 5s ease-in-out infinite}
      .float{animation:float 7s ease-in-out infinite}
      .float-late{animation:float 8s ease-in-out -3s infinite}
      .signal{animation:signal 4s ease-in-out infinite}
      .signal-late{animation:signal 5s ease-in-out -2s infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes spin-reverse{to{transform:rotate(-360deg)}}
      @keyframes pulse{0%,100%{opacity:.45;transform:scale(.96)}50%{opacity:.9;transform:scale(1.04)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
      @keyframes signal{0%,100%{opacity:.25}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.orbit,.orbit-reverse,.pulse,.float,.float-late,.signal,.signal-late{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#background)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <ellipse cx="1040" cy="90" rx="350" ry="300" fill="url(#violetAura)"/>
    <ellipse cx="720" cy="410" rx="390" ry="270" fill="url(#cyanAura)"/>
    <path d="M650 -80L1120 480" stroke="url(#fade)" stroke-width="150" opacity="0.09" filter="url(#blur)"/>
    <g fill="#A5B4FC">
      <circle cx="710" cy="64" r="1.6" opacity="0.55"/>
      <circle cx="790" cy="110" r="1.2" opacity="0.35"/>
      <circle cx="1110" cy="52" r="1.5" opacity="0.5"/>
      <circle cx="1140" cy="258" r="1.4" opacity="0.35"/>
      <circle cx="765" cy="342" r="1.7" opacity="0.45"/>
      <circle cx="670" cy="278" r="1.1" opacity="0.3"/>
      <circle class="signal" cx="836" cy="48" r="2.2" fill="#22D3EE"/>
      <circle class="signal-late" cx="1084" cy="350" r="2.2" fill="#C084FC"/>
      <circle class="signal" cx="1160" cy="144" r="1.8" fill="#818CF8"/>
    </g>
    <rect x="1" y="1" width="1198" height="398" rx="29" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

    <g class="sans">
      <text x="74" y="68" class="mono" font-size="15" letter-spacing="3.2" fill="#94A3B8">LONDON / UNITED KINGDOM</text>
      <rect x="74" y="94" width="58" height="4" rx="2" fill="url(#headline)"/>
      <text x="69" y="184" font-size="76" font-weight="750" letter-spacing="1.5" fill="url(#headline)">HALIT OZGER</text>
      <text x="74" y="232" class="mono" font-size="20" letter-spacing="2.6" fill="#C7D2FE">FULL STACK DEVELOPER • AI/ML ENGINEER</text>
      <text x="74" y="303" font-size="25" font-weight="400" fill="#E2E8F0">Intelligent systems. Useful products.</text>
      <text x="74" y="345" class="mono" font-size="13" letter-spacing="2.2" fill="#64748B">DESIGN  /  CODE  /  INTELLIGENCE</text>
    </g>

    <path d="M690 78V322" stroke="url(#fade)" stroke-width="1" opacity="0.35" transform="rotate(90 690 200)"/>
    <g>
      <circle class="pulse" cx="930" cy="200" r="176" fill="url(#violetAura)"/>
      <g class="orbit">
        <circle cx="930" cy="200" r="142" fill="none" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3 11"/>
        <circle cx="930" cy="58" r="6" fill="#22D3EE"/>
        <circle cx="930" cy="58" r="13" fill="none" stroke="#22D3EE" stroke-opacity="0.28"/>
        <circle cx="1053" cy="271" r="5" fill="#C084FC"/>
        <circle cx="807" cy="271" r="4" fill="#818CF8"/>
      </g>
      <g class="orbit-reverse">
        <ellipse cx="930" cy="200" rx="116" ry="76" fill="none" stroke="#22D3EE" stroke-opacity="0.23" stroke-width="1.2" transform="rotate(-24 930 200)"/>
        <circle cx="1030" cy="151" r="4.5" fill="#67E8F9"/>
        <circle cx="830" cy="249" r="3.5" fill="#A5B4FC"/>
      </g>
      <g fill="none" stroke-linecap="round">
        <path class="signal" d="M930 58V129" stroke="#22D3EE" stroke-opacity="0.5"/>
        <path class="signal-late" d="M1053 271L982 238" stroke="#C084FC" stroke-opacity="0.45"/>
        <path class="signal" d="M807 271L878 238" stroke="#818CF8" stroke-opacity="0.45"/>
      </g>
      <path d="M930 125L995 163V237L930 275L865 237V163Z" fill="#0B1033" fill-opacity="0.94" stroke="url(#edge)" stroke-width="1.6"/>
      <path d="M930 139L983 170V230L930 261L877 230V170Z" fill="url(#core)" stroke="#818CF8" stroke-opacity="0.18"/>
      <circle cx="930" cy="200" r="41" fill="url(#violetAura)"/>
      <text x="930" y="211" text-anchor="middle" class="mono" font-size="35" font-weight="700" letter-spacing="2" fill="#E0E7FF">AI</text>
      <circle cx="930" cy="139" r="2.5" fill="#22D3EE"/>
      <circle cx="983" cy="230" r="2.5" fill="#C084FC"/>
      <circle cx="877" cy="230" r="2.5" fill="#818CF8"/>
    </g>

    <g class="float">
      <rect x="1000" y="77" width="142" height="36" rx="18" fill="#0E1533" stroke="#22D3EE" stroke-opacity="0.3"/>
      <circle cx="1019" cy="95" r="3" fill="#22D3EE"/>
      <text x="1030" y="100" class="mono" font-size="11" letter-spacing="1.2" fill="#A5F3FC">AGENT NATIVE</text>
    </g>
    <g class="float-late">
      <rect x="748" y="294" width="136" height="36" rx="18" fill="#11102F" stroke="#A855F7" stroke-opacity="0.3"/>
      <circle cx="767" cy="312" r="3" fill="#C084FC"/>
      <text x="778" y="317" class="mono" font-size="11" letter-spacing="1.2" fill="#DDD6FE">LOCAL-FIRST</text>
    </g>
  </g>
</svg>
