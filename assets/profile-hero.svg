  <use href="#node" x="806" y="238" width="12" height="12"/><use href="#mintNode" x="1322" y="340" width="12" height="12" class="node-pulse delay-2"/>
  <use href="#node" x="1300" y="406" width="12" height="12"/><use href="#node" x="990" y="423" width="12" height="12"/>
